<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial}
header{text-align:center;padding:28px;background:#171717}
h1{color:#e83d59;margin:0}
header p{color:#aaa}
main{max-width:1100px;margin:auto;padding:20px}
input{width:100%;padding:14px;background:#1b1b1b;border:1px solid #444;color:white;border-radius:8px}
nav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}
button{background:#252525;color:white;border:1px solid #444;padding:11px 15px;border-radius:8px;cursor:pointer}
button.active,button:hover{background:#bb2440}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:#191919;border-radius:10px;overflow:hidden;border:1px solid #333}
.card img{width:100%;height:240px;object-fit:cover;cursor:pointer}
.card h3{font-size:15px;text-align:center;padding:8px}
.card p{text-align:center;color:#999;font-size:12px}
.empty{grid-column:1/-1;padding:35px;text-align:center;color:#aaa}
#viewer{display:none;position:fixed;inset:0;background:#000e;align-items:center;justify-content:center;z-index:10}
#viewer img{max-width:95%;max-height:85vh}
#viewer button{position:absolute;right:20px;top:20px}
</style>
</head>
<body>
<header>
<h1>PRIVATE MODEL GALLERY</h1>
<p>Glamour Portrait Collection</p>
</header>
<main>
<input id="search" placeholder="Search models..." oninput="render()">
<nav id="nav"></nav>
<div class="grid" id="gallery"></div>
</main>
<div id="viewer" onclick="this.style.display='none'">
<button>Close ✕</button>
<img id="large">
</div>
<script>
const models=[
"Abella Danger","Riley Reid","Mia Khalifa",
"Lana Rhoades","Mia Malkova","Sasha Grey",
"Adriana Chechik","Asa Akira","Dani Daniels",
"Lena Paul","Eva Lovia","Alexis Texas",
"Jenna Jameson","Lisa Ann"
];
let selected="All";function init(){
const nav=document.getElementById("nav");
["All",...models].forEach(name=>{
let b=document.createElement("button");
b.textContent=name;
if(name==="All")b.classList.add("active");
b.onclick=()=>{
selected=name;
nav.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
};
nav.appendChild(b);
});
render();
}
function render(){
let gallery=document.getElementById("gallery");
let q=document.getElementById("search").value.toLowerCase();
gallery.innerHTML="";
let list=models.filter(m=>
(selected==="All"||m===selected)&&m.toLowerCase().includes(q));
list.forEach(name=>{
let card=document.createElement("div");
card.className="card";
let heading=document.createElement("h3");
heading.textContent=name;
let info=document.createElement("p");
info.textContent="Glamour portraits";
let msg=document.createElement("p");
msg.textContent="Photo source to be added with usage permission";
card.append(heading,info,msg);
gallery.appendChild(card);
});
if(!list.length)gallery.innerHTML='<div class="empty">No models found.</div>';
}
init();
</script>

</body>
</html>
